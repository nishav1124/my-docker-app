name: Beginner Docker CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step A: Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step B: Log in to Docker Hub using your GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step C: Build the image tagged with your Docker Hub username
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-first-app:latest .

      # Step D: Start and test the container before pushing
      - name: Run and test container
        run: |
          docker run -d --name test-container -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/my-first-app:latest
          sleep 3
          curl http://localhost:3000

      # Step E: Push the verified image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-first-app:latest
